function excelToDate(n) {
  if (n == null) return null;
  const d = new Date(Math.round((n - 25569) * 86400 * 1000));
  return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}
function fmtDate(d) {
  if (!d) return '-';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

const parsed = RAW.map(r => ({
  ...r,
  startDate: excelToDate(r.start),
  endDate: excelToDate(r.end),
}));

const months = [...new Set(parsed.map(r => {
  const d = r.startDate;
  return d ? d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') : null;
}).filter(Boolean))].sort();

const sel = document.getElementById('monthSel');
months.forEach(m => {
  const opt = document.createElement('option');
  opt.value = m;
  opt.textContent = m.replace('-', '년 ') + '월';
  sel.appendChild(opt);
});

const today = new Date();
const currentMonth = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0');
if (months.includes(currentMonth)) sel.value = currentMonth;
else sel.value = months[0] || '';

let currentFilter = 'all';

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function isUnused(r) {
  return r.remain > 0 && (r.used === null || r.used === 0);
}

function render() {
  const m = sel.value;
  if (!m) return;
  const [yr, mo] = m.split('-').map(Number);

  let rows = parsed.filter(r => {
    const d = r.startDate;
    return d && d.getFullYear() === yr && d.getMonth()+1 === mo;
  });

  const total = rows.length;
  const unused = rows.filter(isUnused).length;
  const used = rows.filter(r => !isUnused(r)).length;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="label">해당 월 생일자</div><div class="value">${total}명</div></div>
    <div class="stat-card"><div class="label">미사용</div><div class="value warn">${unused}명</div></div>
    <div class="stat-card"><div class="label">사용완료</div><div class="value done">${used}명</div></div>
  `;

  if (currentFilter === 'unused') rows = rows.filter(isUnused);
  else if (currentFilter === 'used') rows = rows.filter(r => !isUnused(r));

  const tbody = document.getElementById('tableBody');
  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">해당 조건의 직원이 없습니다.</div></td></tr>`;
  } else {
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td style="font-size:12px; color:var(--color-text-secondary);">${r.no}</td>
        <td style="font-weight:500;">${r.name}</td>
        <td>${fmtDate(r.startDate)}</td>
        <td>${fmtDate(r.endDate)}</td>
        <td style="text-align:center;">${r.used ?? 0}일</td>
        <td style="text-align:center;">${r.remain}일</td>
        <td>${isUnused(r)
          ? '<span class="badge badge-unused">미사용</span>'
          : '<span class="badge badge-used">완료</span>'}</td>
      </tr>
    `).join('');
  }

  const unusedList = parsed.filter(r => {
    const d = r.startDate;
    return d && d.getFullYear() === yr && d.getMonth()+1 === mo && isUnused(r);
  });

  const dmSection = document.getElementById('dmSection');
  if (unusedList.length === 0) {
    dmSection.innerHTML = `<div class="dm-box"><div class="empty-state" style="padding:1rem;">이번 달 미사용자가 없습니다 🎉</div></div>`;
    return;
  }

  const monthLabel = mo + '월';

  const msgs = unusedList.map(r => {
    return `안녕하세요, ${r.name}님.\n${monthLabel} 생일을 축하드립니다!🎉\n부릉에서는 생일 당월, 더 행복한 한 달 보내실 수 있도록 생일휴가 1일을 드리고 있습니다.\n📅 생일휴가 1일 부여\n\n* 신청 및 사용 기한: 생일 당월인 ${monthLabel} 말일까지\n* 말일 이후 자동소멸되며, 당월 내에서만 사용 가능\n\n📌 신청 방법\n\n* 옴니이솔 → 인사관리 → My HR(ESS) → 근태신청(NEW) → [휴가신청서]\n→ 휴가종류 선택: \`기타휴가\` > \`생일휴가\` 선택\n\n📢 결재 라인\n\n* \`1차 조직장(결재)\` - \`피플실(합의)\`\n* 주의사항: 반드시 '피플실(합의)' 지정\n\n즐겁고 행복한 한 달 되세요! 🎉`;
  });

  dmSection.innerHTML = `
    <p class="section-title">슬랙 DM 문구 (미사용자 ${unusedList.length}명)</p>
    ${unusedList.map((r, i) => `
      <div class="dm-box">
        <div class="dm-header">
          <span><strong style="color:var(--color-text-primary);">${r.name}</strong> (${r.no})</span>
          <button class="copy-btn" onclick="copyMsg(${i})" id="copyBtn${i}"><i class="ti ti-copy" aria-hidden="true" style="margin-right:4px;"></i>복사</button>
        </div>
        <div class="dm-msg" id="dmMsg${i}">${msgs[i]}</div>
      </div>
    `).join('')}
  `;

  window._msgs = msgs;
}

function copyMsg(i) {
  const text = window._msgs[i];
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn' + i);
    btn.innerHTML = '<i class="ti ti-check" aria-hidden="true" style="margin-right:4px;"></i>복사됨';
    btn.style.color = 'var(--color-text-success)';
    setTimeout(() => {
      btn.innerHTML = '<i class="ti ti-copy" aria-hidden="true" style="margin-right:4px;"></i>복사';
      btn.style.color = '';
    }, 2000);
  });
}

sel.addEventListener('change', render);
render();
</script>
